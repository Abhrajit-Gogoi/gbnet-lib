[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-net-lib"
version = "0.1.0"
description = "A lightweight autograd engine and neural network library built from scratch using NumPy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["autograd", "neural-network", "deep-learning", "backpropagation", "machine-learning", "numpy"]

[project.urls]
Homepage = "https://github.com/Abhrajit-Gogoi/autograd-engine"
Repository = "https://github.com/Abhrajit-Gogoi/autograd-engine"
Issues = "https://github.com/Abhrajit-Gogoi/autograd-engine/issues"

[tool.setuptools]
py-modules = ["gb_net_lib"]

[tool.setuptools.package-dir]
"" = "src"